services:
  api:
    build: ./docker/php
    user: "1000:1000"
    working_dir: /app
    environment:
      HOME: /tmp # o usuário 1000 não tem home no container (tinker/psysh precisam)
      AI_FAKE_FAIL_PLAN_FOR: ${AI_FAKE_FAIL_PLAN_FOR:-} # só E2E-07
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_healthy

  # Gera os planos (GeneratePlanJob). Sem ele, os planos ficam "pending" e viram TIMEOUT.
  queue:
    build: ./docker/php
    user: "1000:1000"
    working_dir: /app
    environment:
      HOME: /tmp
      AI_FAKE_FAIL_PLAN_FOR: ${AI_FAKE_FAIL_PLAN_FOR:-} # só E2E-07
    volumes:
      - .:/app
    command: php artisan queue:work --tries=1 --timeout=170 --sleep=1
    restart: unless-stopped # volta sozinho (ex.: depois de um migrate:fresh derrubar as tabelas)
    depends_on:
      mysql:
        condition: service_healthy

  # Tarefas agendadas (plans:fail-stale; lembretes no Plano 07).
  scheduler:
    build: ./docker/php
    user: "1000:1000"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    command: php artisan schedule:work
    restart: unless-stopped # volta sozinho (ex.: depois de um migrate:fresh derrubar as tabelas)
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prato_forte
      MYSQL_USER: prato
      MYSQL_PASSWORD: prato
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql-data:
